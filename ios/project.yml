name: Airlock
options:
  bundleIdPrefix: app.airlock
  deploymentTarget:
    iOS: "27.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
targets:
  Airlock:
    type: application
    platform: iOS
    sources:
      - path: Airlock
      - path: ../fixtures/notes.json
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.airlock.hybrid
        # Simulator builds sign ad hoc so Firebase Auth can use the keychain;
        # set DEVELOPMENT_TEAM and Automatic signing to run on a phone.
        CODE_SIGN_STYLE: Manual
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Airlock
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Airlock/Info.plist
